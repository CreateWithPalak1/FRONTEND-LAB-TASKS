<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            transition: background-color 0.5s ease;
        }
        .box:hover {
            background-color: lightcoral;
        }
    </style>
</head>
<body>
    <h1>Transition property</h1>
    <div class="box"></div>
    
</body>
</html>
