
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - Online Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">QuizMaster</a>
            <span class="text-white">Learn • Play • Win</span>
        </div>
    </nav>

    <section class="hero text-center">
        <div class="container">
            <h1>Welcome to QuizMaster!</h1>
            <p>Challenge your knowledge and test your skills.</p>
            <button class="btn btn-light btn-lg" onclick="startQuiz()">
                Start Quiz
            </button>
        </div>
    </section>

    <div class="container quiz-container">

        <div id="quiz-box" class="quiz-card" style="display:none;">

            <div class="d-flex justify-content-between mb-3">
                <span id="question-number">Question 1</span>
                <span id="timer">Time: 30s</span>
            </div>

            <div class="progress mb-4">
                <div id="progress-bar" class="progress-bar" style="width:0%"></div>
            </div>

            <h3 id="question">Question appears here</h3>

            <div id="options" class="mt-4"></div>

            <div class="d-flex justify-content-between mt-4">
                <button class="btn btn-secondary" onclick="previousQuestion()">
                    Previous
                </button>

                <button class="btn btn-primary" onclick="nextQuestion()">
                    Next
                </button>
            </div>

        </div>

        <div id="result-box" class="quiz-card text-center" style="display:none;">
            <h2>Quiz Completed!</h2>
            <h1 id="score"></h1>
            <p id="result-message"></p>
            <button class="btn btn-primary" onclick="restartQuiz()">
                Restart Quiz
            </button>
        </div>

    </div>

    <footer class="text-center">
        <p>© 2026 QuizMaster | Mini Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
